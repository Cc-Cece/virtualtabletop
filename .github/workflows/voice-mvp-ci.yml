name: Voice MVP checks

on:
  push:
    branches:
      - agent/realtime-voice-mvp

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse changed JavaScript
        run: |
          node --check server/voice.mjs
          node --check server/player.mjs
          node --check client/js/voice.js
          node --check server/minify.mjs
      - name: Run voice tests
        run: npm test -- --runInBand tests/voice.test.js
